{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Editar Perfil</h3>
            </div>
            <div class="card-body">
                <div class="text-center mb-4">
                    {% if user.foto %}
                    <img src="{{ user.foto.url }}" class="rounded-circle img-thumbnail"
                        style="width: 150px; height: 150px; object-fit: cover;" alt="Foto de perfil">
                    {% else %}
                    <div class="rounded-circle bg-secondary d-inline-flex align-items-center justify-content-center text-white"
                        style="width: 150px; height: 150px; font-size: 3rem;">
                        {{ user.username|slice:":1"|upper }}
                    </div>
                    {% endif %}
                </div>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.first_name.id_for_label }}" class="form-label">Nombre</label>
                            {{ form.first_name }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.last_name.id_for_label }}" class="form-label">Apellido</label>
                            {{ form.last_name }}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.email.id_for_label }}" class="form-label">Email</label>
                        {{ form.email }}
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.telefono.id_for_label }}" class="form-label">Teléfono</label>
                        {{ form.telefono }}
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.direccion.id_for_label }}" class="form-label">Dirección</label>
                        {{ form.direccion }}
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.foto.id_for_label }}" class="form-label">Foto de Perfil</label>
                        {{ form.foto }}
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary me-md-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
