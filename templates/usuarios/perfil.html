{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mx-2 mx-lg-0">
    <div class="col-12 col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white py-3">
                <h3 class="mb-0 text-center text-md-start" style="font-size:clamp(1.1rem, 3.5vw, 1.5rem);">Editar Perfil</h3>
            </div>
            <div class="card-body p-3 p-md-4">
                <div class="text-center mb-4">
                    {% if user.foto %}
                    <img src="{{ user.foto.url }}" class="rounded-circle img-thumbnail"
                        style="width: clamp(100px, 25vw, 150px); height: clamp(100px, 25vw, 150px); object-fit: cover;" alt="Foto de perfil">
                    {% else %}
                    <div class="rounded-circle bg-secondary d-inline-flex align-items-center justify-content-center text-white mx-auto"
                        style="width: clamp(100px, 25vw, 150px); height: clamp(100px, 25vw, 150px); font-size: clamp(2rem, 6vw, 3rem);">
                        {{ user.username|slice:":1"|upper }}
                    </div>
                    {% endif %}
                </div>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row g-2 g-md-3">
                        <div class="col-md-6 mb-2 mb-md-3">
                            <label for="{{ form.first_name.id_for_label }}" class="form-label" style="font-size:clamp(0.82rem, 2vw, 0.95rem);">Nombre</label>
                            {{ form.first_name }}
                        </div>
                        <div class="col-md-6 mb-2 mb-md-3">
                            <label for="{{ form.last_name.id_for_label }}" class="form-label" style="font-size:clamp(0.82rem, 2vw, 0.95rem);">Apellido</label>
                            {{ form.last_name }}
                        </div>
                    </div>

                    <div class="mb-2 mb-md-3">
                        <label for="{{ form.email.id_for_label }}" class="form-label" style="font-size:clamp(0.82rem, 2vw, 0.95rem);">Email</label>
                        {{ form.email }}
                    </div>

                    <div class="mb-2 mb-md-3">
                        <label for="{{ form.telefono.id_for_label }}" class="form-label" style="font-size:clamp(0.82rem, 2vw, 0.95rem);">Teléfono</label>
                        {{ form.telefono }}
                    </div>

                    <div class="mb-2 mb-md-3">
                        <label for="{{ form.direccion.id_for_label }}" class="form-label" style="font-size:clamp(0.82rem, 2vw, 0.95rem);">Dirección</label>
                        {{ form.direccion }}
                    </div>

                    <div class="mb-2 mb-md-3">
                        <label for="{{ form.foto.id_for_label }}" class="form-label" style="font-size:clamp(0.82rem, 2vw, 0.95rem);">Foto de Perfil</label>
                        {{ form.foto }}
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
