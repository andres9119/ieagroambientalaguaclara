{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-4 py-lg-5 mx-2 mx-lg-0">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white py-3">
                <h3 class="mb-0 text-center" style="font-size:clamp(1.1rem, 4vw, 1.5rem);">Iniciar Sesión</h3>
            </div>
            <div class="card-body p-3 p-md-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" id="id_username" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <input type="password" name="password" class="form-control" id="id_password" required>
                            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="id_password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    {% if form.errors %}
                    <div class="alert alert-danger py-2 small">
                        Usuario o contraseña incorrectos.
                    </div>
                    {% endif %}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2">Ingresar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
