{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block breadcrumbs %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb mb-0">
    <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">Dashboard</a></li>
    <li class="breadcrumb-item active" aria-current="page">{{ titulo }}</li>
  </ol>
</nav>
{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-danger shadow-sm">
        <div class="card-header bg-danger text-white">
          <h4 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>{{ titulo }}</h4>
        </div>
        <div class="card-body text-center py-5">
          <i class="fas fa-trash-alt fa-4x text-danger mb-4"></i>
          <p class="lead mb-4">{{ mensaje }}</p>
          <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
              <button type="submit" class="btn btn-danger px-4"><i class="fas fa-trash me-2"></i>Sí, eliminar</button>
              <a href="{% url cancelar_url %}" class="btn btn-outline-secondary px-4">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
